
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Home 2050 - Login</title>

    <link rel="stylesheet" href="Login.css">
</head>

<body class="login-page">

    <!-- Animated Background -->
    <div class="background-effects">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>

        <div class="grid"></div>
    </div>

    <!-- Login Card -->
    <div class="login-card">

        <div class="logo">
            🏠
        </div>

        <h1>Smart Home <span>2050</span></h1>

        <p class="subtitle">
            Welcome back to your intelligent home
        </p>

        <form id="loginForm">

            <div class="input-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                <span>LOGIN TO SMART HOME</span>
                <span class="arrow">→</span>
            </button>


            <!-- Message -->
            <p id="loginMessage" class="login-message"></p>

        </form>


        <div class="divider">
            <span>OR</span>
        </div>


        <p class="signup-text">

            Don't have an account?

            <a href="Signup.html">
                Create Account
            </a>

        </p>


        <p class="demo-text">
            🔐 Your account is protected by Smart Home security
        </p>

    </div>


    <script src="Login.js"></script>

</body>

</html>
